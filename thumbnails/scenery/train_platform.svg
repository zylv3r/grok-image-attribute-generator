<svg xmlns="http://www.w3.org/2000/svg" width="320" height="242" viewBox="0 0 320 242" role="img"><title >Train Platform — illustrative steering guide</title><desc >A train platform with a shelter and parallel tracks. Illustrative steering guide, not an actual AI example.</desc><rect x="0" y="0" width="320" height="242" fill="#f7f9fb" rx="12"></rect><text x="160" y="25" fill="#26344a" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Train Platform</text><svg x="20" y="40" width="280" height="160" viewBox="0 0 280 160" overflow="hidden" data-art="steering"><rect x="0" y="0" width="280" height="104" fill="#dae8ed"></rect><rect x="0" y="104" width="280" height="56" fill="#c3d1bd"></rect><line x1="123.5" y1="93" x2="85" y2="160" stroke="#26344a" stroke-width="3" stroke-linecap="round"></line><line x1="153.5" y1="93" x2="185" y2="160" stroke="#26344a" stroke-width="3" stroke-linecap="round"></line><line x1="105.0" y1="112" x2="170.0" y2="112" stroke="#8e8c88" stroke-width="3" stroke-linecap="round"></line><line x1="99.6" y1="130" x2="175.4" y2="130" stroke="#8e8c88" stroke-width="3" stroke-linecap="round"></line><line x1="93.6" y1="150" x2="181.4" y2="150" stroke="#8e8c88" stroke-width="3" stroke-linecap="round"></line><rect x="22" y="34" width="84" height="9" fill="#81939d"></rect><line x1="31" y1="43" x2="31" y2="111" stroke="#26344a" stroke-width="3" stroke-linecap="round"></line><line x1="97" y1="43" x2="97" y2="111" stroke="#26344a" stroke-width="3" stroke-linecap="round"></line><rect x="39" y="48" width="50" height="40" fill="#adcbd5"></rect></svg><text x="160" y="219" fill="#596b7c" font-family="sans-serif" font-size="10" text-anchor="middle">Illustrative steering guide</text><text x="160" y="234" fill="#738393" font-family="sans-serif" font-size="9" text-anchor="middle">Not an actual AI example</text></svg>
