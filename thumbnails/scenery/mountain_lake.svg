<svg xmlns="http://www.w3.org/2000/svg" width="320" height="242" viewBox="0 0 320 242" role="img"><title >Mountain Lake — illustrative steering guide</title><desc >A lakeshore backed by distinct mountain ridges. Illustrative steering guide, not an actual AI example.</desc><rect x="0" y="0" width="320" height="242" fill="#f7f9fb" rx="12"></rect><text x="160" y="25" fill="#26344a" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Mountain Lake</text><svg x="20" y="40" width="280" height="160" viewBox="0 0 280 160" overflow="hidden" data-art="steering"><rect x="0" y="0" width="280" height="104" fill="#dae8ed"></rect><rect x="0" y="104" width="280" height="56" fill="#c3d1bd"></rect><polygon points="0,105 60,22 114,82 181,9 280,105" fill="#96a9b5"></polygon><polygon points="151,40 181,9 207,43 187,35 173,41" fill="#f3f5f6"></polygon><rect x="0" y="91" width="280" height="50" fill="#88b2c2"></rect><line x1="12" y1="100" x2="264" y2="100" stroke="#c0d8dd" stroke-width="1" stroke-linecap="round"></line><line x1="12" y1="112" x2="264" y2="112" stroke="#c0d8dd" stroke-width="1" stroke-linecap="round"></line><line x1="12" y1="125" x2="264" y2="125" stroke="#c0d8dd" stroke-width="1" stroke-linecap="round"></line></svg><text x="160" y="219" fill="#596b7c" font-family="sans-serif" font-size="10" text-anchor="middle">Illustrative steering guide</text><text x="160" y="234" fill="#738393" font-family="sans-serif" font-size="9" text-anchor="middle">Not an actual AI example</text></svg>
