<svg xmlns="http://www.w3.org/2000/svg" width="320" height="242" viewBox="0 0 320 242" role="img"><title >Stretching Shoulders — illustrative steering guide</title><desc >Standing with both hands linked above the head in a gentle stretch. Illustrative steering guide, not an actual AI example.</desc><rect x="0" y="0" width="320" height="242" fill="#f7f9fb" rx="12"></rect><text x="160" y="25" fill="#26344a" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">Stretching Shoulders</text><svg x="20" y="40" width="280" height="160" viewBox="0 0 280 160" overflow="hidden" data-art="steering"><line x1="50" y1="151" x2="230" y2="151" stroke="#bac5d0" stroke-width="1" stroke-linecap="round"></line><polygon points="126,55 154,55 148,96 132,96" fill="#6387ad" stroke="#26344a" stroke-width="1.5"></polygon><line x1="126" y1="55" x2="114" y2="24" stroke="#c88d6c" stroke-width="7" stroke-linecap="round"></line><line x1="114" y1="24" x2="139" y2="5" stroke="#c88d6c" stroke-width="7" stroke-linecap="round"></line><circle cx="139" cy="5" r="3" fill="#c88d6c"></circle><line x1="154" y1="55" x2="166" y2="24" stroke="#c88d6c" stroke-width="7" stroke-linecap="round"></line><line x1="166" y1="24" x2="141" y2="5" stroke="#c88d6c" stroke-width="7" stroke-linecap="round"></line><circle cx="141" cy="5" r="3" fill="#c88d6c"></circle><line x1="132" y1="96" x2="128" y2="121" stroke="#26344a" stroke-width="8" stroke-linecap="round"></line><line x1="128" y1="121" x2="123" y2="148" stroke="#26344a" stroke-width="8" stroke-linecap="round"></line><line x1="120" y1="149" x2="129" y2="149" stroke="#26344a" stroke-width="4" stroke-linecap="round"></line><line x1="148" y1="96" x2="152" y2="121" stroke="#26344a" stroke-width="8" stroke-linecap="round"></line><line x1="152" y1="121" x2="157" y2="148" stroke="#26344a" stroke-width="8" stroke-linecap="round"></line><line x1="154" y1="149" x2="163" y2="149" stroke="#26344a" stroke-width="4" stroke-linecap="round"></line><line x1="140